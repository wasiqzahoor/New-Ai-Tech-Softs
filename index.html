    <!-- Critical CSS for loading screen & preventing layout shifts -->
    <style>
      /* Base reset */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      
      /* Prevent layout shift during loading */
      html { 
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      body { 
        margin: 0; 
        background: #0a0a1e; 
        min-height: 100vh;
        overflow-x: hidden;
      }
      
      #root { 
        min-height: 100vh; 
      }
      
      /* Prevent CLS - Reserve space for images */
      img { max-width: 100%; height: auto; display: block; }
      
      /* Prevent CLS - Set font display swap */
      @font-face {
        font-family: 'Inter';
        font-display: swap;
      }
      @font-face {
        font-family: 'Poppins';
        font-display: swap;
      }
